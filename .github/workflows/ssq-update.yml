name: SSQ Auto Update (v15)
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ssq-update.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests --break-system-packages --quiet
      - name: 抓数据 + 推 Gist (v15)
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 2dd6663382955b90697ab6aec9c165c8
        run: |
          curl -sL "https://gist.githubusercontent.com/mz18607358885-cpu/$GIST_ID/raw/fetch_ssq_v15.py" -o /tmp/v15.py
          python3 /tmp/v15.py
