name: SSQ Auto Update (v13 Gist)
on:
  schedule:
    - cron: '*/2 * * * *'   # ← 每 2 分钟 (覆盖开奖前后)
  workflow_dispatch:
  repository_dispatch:
    types: [ssq-update]
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests --break-system-packages --quiet
      - name: 抓数据 + 推 Gist (v13)
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}   # ← 用 GIST_TOKEN 不是 GH_TOKEN
          GIST_ID: 2dd6663382955b90697ab6aec9c165c8
        run: |
          curl -sL "https://gist.githubusercontent.com/mz18607358885-cpu/$GIST_ID/raw/fetch_ssq_v13.py" -o /tmp/v13.py
          python3 /tmp/v13.py
