name: 自动更新双色球数据
on:
  schedule:
    - cron: '30 13 * * 0,2,4'    # 21:30 北京
    - cron: '0 14 * * *'         # 22:00 北京兜底
  workflow_dispatch:
jobs:
  fetch-ssq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests beautifulsoup4
      - name: 拉取数据
        env: { JUHE_KEY: ${{ secrets.JUHE_KEY }} }
        run: python fetch_ssq.py
      - name: 提交
        env: { GH_PAT: ${{ secrets.GH_PAT }} }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssq_data.json
          git diff --staged --quiet || git commit -m "auto: 更新 $(python -c 'import json; print(json.load(open(\"ssq_data.json\"))[-1][\"period\"])')"
          git push https://x-access-token:${GH_PAT}@github.com/mz18607358885-cpu/ssq-data.git main
