name: 更新双色球数据

on:
  schedule:
    - cron: '30 13 * * 2,4,0'
  workflow_dispatch:
  push:
    paths:
      - 'fetch_ssq.py'
      - '.github/workflows/ssq-update.yml'

jobs:
  fetch-ssq:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python fetch_ssq.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssq_data.json
          if git diff --staged --quiet; then
            echo "无变化"
          else
            PERIOD=$(python -c "import json; d=json.load(open('ssq_data.json')); print(d[-1]['period'] if d else '')")
            git commit -m "🔄 $PERIOD"
            git push
          fi
