name: 自动更新双色球数据
on:
  schedule:
    - cron: '0 14 * * 0,2,4'
  workflow_dispatch:
jobs:
  fetch-ssq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --break-system-packages
      - name: 拉取最新数据
        run: python fetch_ssq.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssq_data.json
          if git diff --cached --quiet; then
            echo "✓ 无新数据"
            exit 0
          fi
          MSG="auto: 更新到 $(python -c 'import json; d=json.load(open("ssq_data.json")); print(d[-1]["period"])')"
          git commit -m "$MSG"
          git push
          echo "✓ push 成功"
