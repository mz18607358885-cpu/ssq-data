name: SSQ Update
on:
  schedule:
    - cron: '0 14 * * 0,2,4'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests --break-system-packages
      - run: python fetch_ssq.py
      - run: |
          git config user.name "ssq-bot"
          git config user.email "ssq@bot.local"
          git add ssq_data.json
          git diff --cached --quiet && echo "无新数据" && exit 0
          PERIOD=$(python -c "import json; print(json.load(open('ssq_data.json'))[-1]['period'])")
          git commit -m "auto: 更新到 $PERIOD"
          git push
          echo "push 成功"
